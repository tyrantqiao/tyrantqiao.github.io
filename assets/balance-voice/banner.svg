<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Balance Voice — 网页音量，统一掌控</title>
  <desc id="desc">深绿色背景上的声音波形，以及统一音量、响度均衡、分贝上限、本机处理四个功能标签。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d17"/><stop offset="1" stop-color="#204532"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#79e4b6" stop-opacity=".18"/><stop offset="1" stop-color="#79e4b6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <ellipse cx="1040" cy="175" rx="300" ry="230" fill="url(#glow)"/>
  <g transform="translate(68 58)">
    <rect width="56" height="56" rx="17" fill="#7be0ba"/>
    <g stroke="#153b2a" stroke-width="5" stroke-linecap="round"><path d="M15 24v8M22 17v22M29 12v32M36 17v22M43 24v8"/></g>
    <text x="75" y="38" fill="#effff5" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="650">Balance Voice</text>
  </g>
  <text x="68" y="184" fill="#f0fff7" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="48" font-weight="700">网页音量，统一掌控。</text>
  <text x="70" y="232" fill="#b4d6c2" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="21">少一点音量落差，多一点安稳聆听。</text>
  <g fill="none" stroke="#7be0ba" stroke-width="10" stroke-linecap="round" opacity=".65">
    <path d="M823 167v50M850 140v104M877 110v164M904 155v74M931 127v130M958 83v218M985 139v106M1012 161v62M1039 117v150M1066 146v92M1093 172v40"/>
  </g>
  <g font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="16" fill="#c6efda">
    <rect x="68" y="284" width="125" height="39" rx="10" fill="#284b36" stroke="#4a7259"/><text x="98" y="310">统一音量</text>
    <rect x="207" y="284" width="125" height="39" rx="10" fill="#284b36" stroke="#4a7259"/><text x="237" y="310">响度均衡</text>
    <rect x="346" y="284" width="125" height="39" rx="10" fill="#284b36" stroke="#4a7259"/><text x="376" y="310">分贝上限</text>
    <rect x="485" y="284" width="125" height="39" rx="10" fill="#284b36" stroke="#4a7259"/><text x="515" y="310">本机处理</text>
  </g>
  <text x="1127" y="352" text-anchor="end" fill="#8db99f" font-family="Segoe UI,Arial,sans-serif" font-size="13">CHROME EXTENSION · OPEN SOURCE · MIT</text>
</svg>
